name: Publish verified OKX SOXL-USDT-SWAP public snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-okx.yml'
      - 'scripts/publish_okx.py'
      - 'tests/test_okx.py'
      - 'tests/test_verify_okx.py'
      - 'scripts/verify_okx.py'
      - 'data/refresh-request.txt'
  schedule:
    # Request at minutes 2,7,12... to avoid top-of-hour load. GitHub may delay/skip jobs.
    - cron: '2-59/5 * * * *'

permissions:
  contents: write

concurrency:
  group: publish-okx-soxl
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Fetch read-only OKX contract data and calculate confirmed 1D + 4H indicators
        run: python scripts/publish_okx.py --output data/OKX-SOXL-USDT-SWAP.json
      - name: Check identity and freshness of output
        run: |
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          path = 'data/OKX-SOXL-USDT-SWAP.json'
          report = json.load(open(path,encoding='utf-8'))
          assert report['exchange']=='OKX'
          assert report['symbol']=='SOXL-USDT-SWAP'
          assert report['status']=='live_verified_quotes'
          assert report['market']['last_quote_age_minutes']<=15
          assert report['market']['mark_quote_age_minutes']<=15
          assert report['technical']['4h']['bar_count']>=51
          assert report['technical']['1d']['bar_count']>=51
          print('Verified OKX quote and 1D/4H data at',datetime.now(timezone.utc).isoformat())
          PY
      - name: Verify OKX read-time schema and provenance before publication
        run: python scripts/verify_okx.py --file data/OKX-SOXL-USDT-SWAP.json
      - name: Publish snapshot to repository (public market data only)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/OKX-SOXL-USDT-SWAP.json
          if git diff --cached --quiet; then
            echo 'No change'
          else
            git commit -m 'market: publish verified OKX SOXL-SWAP snapshot'
            # Repository edits may advance main while this job is running.
            # Retry only on ordinary non-fast-forward conflicts; never force-push.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Published after attempt $attempt"
                exit 0
              fi
              echo "Push conflicted with a newer main commit; retry $attempt/3"
              sleep 2
            done
            echo "Publication failed after three retries" >&2
            exit 1
          fi
